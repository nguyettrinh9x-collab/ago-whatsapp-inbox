<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGO Inbox</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  :root{--pk:#2f6bed;--pk-dark:#1e2a4a;--pk-soft:#eef3ff;--recv:#fff;--sent:#dcf8c6;--muted:#8a94a6;--tr:#e0364f;--line:#e6e9f0}
  body{background:#eef1f6;color:#1c2333}
  .hidden{display:none!important}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e2a4a,#2f6bed)}
  .card{background:#fff;padding:34px;border-radius:16px;width:360px;box-shadow:0 16px 50px rgba(0,0,0,.25)}
  .card h1{font-size:21px;margin-bottom:4px;color:var(--pk-dark)}
  .card .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
  .card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:14px}
  .card button{width:100%;padding:12px;background:var(--pk);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .card button:hover{background:#2559d8}
  .err{color:#e0364f;font-size:13px;margin-bottom:10px;min-height:18px}

  /* App shell */
  #app{height:100vh;display:flex;flex-direction:column}
  .topbar{height:52px;background:var(--pk-dark);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;flex-shrink:0}
  .brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{padding:6px 14px;border-radius:8px;font-size:13.5px;color:#c7d0e6;cursor:default}
  .tab.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
  .cfg{margin-left:auto;font-size:12px;color:#aab6d6;display:flex;gap:12px;align-items:center}
  .cfg .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 11px}
  .who{font-size:13px;color:#e8ecf7;margin-left:4px}
  .tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px}
  .tbtn:hover{background:rgba(255,255,255,.24)}

  .body{flex:1;display:flex;min-height:0}

  /* Column 1: conversation list */
  .list-col{width:330px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .lc-head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .lc-title{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .lc-title small{color:var(--muted);font-weight:500}
  .lineFilter{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--pk-soft);color:var(--pk-dark);font-weight:600}
  .list{flex:1;overflow-y:auto}
  .conv{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid #f1f3f8;cursor:pointer;position:relative}
  .conv:hover{background:#f7f9fc}
  .conv.active{background:var(--pk-soft);box-shadow:inset 3px 0 0 var(--pk)}
  .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2f6bed,#57a0ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
  .conv .b{flex:1;min-width:0}
  .conv .n{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .conv .n .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .badge{background:var(--pk);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;flex-shrink:0}
  .line-tag{font-size:10px;color:#2559d8;background:#e4edff;border:1px solid #c3d6ff;border-radius:4px;padding:1px 6px;flex-shrink:0}
  .assign-tag{font-size:10.5px;color:#fff;background:#f0a24b;border-radius:4px;padding:1px 6px}
  .conv-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
  .conv-dot{font-size:9.5px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;line-height:1.5}

  /* Column 2: chat */
  .chat-col{flex:1;display:flex;flex-direction:column;min-width:0;background:#ece5dd}
  .chat-head{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0}
  .chat-head .nm{font-weight:700}
  .chat-head .sub{font-size:12px;color:var(--muted)}
  .langbox{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .langsel{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--pk-soft);color:var(--pk-dark);font-weight:600;cursor:pointer}
  .tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
  .tagchip{font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 11px;cursor:pointer;border:1.5px solid;background:#fff;user-select:none;transition:.12s}
  .tagchip.off{opacity:.5}
  .tagchip.off:hover{opacity:.9}
  .tag-add{font-size:11.5px;color:var(--muted);border:1.5px dashed #c3ccdd;border-radius:20px;padding:3px 10px;cursor:pointer;background:#fff;user-select:none}
  .tag-add:hover{color:var(--pk);border-color:var(--pk)}
  .msgs{flex:1;overflow-y:auto;padding:20px 8%;display:flex;flex-direction:column;gap:10px}
  .row{display:flex}.row.in{justify-content:flex-start}.row.out{justify-content:flex-end}
  .bub{max-width:72%;padding:9px 12px 6px;border-radius:14px;font-size:14px;line-height:1.45;box-shadow:0 1px 2px rgba(20,40,90,.08)}
  .row.in .bub{background:var(--recv);border-top-left-radius:4px}
  .row.out .bub{background:var(--sent);border-top-right-radius:4px}
  .bub img.msgimg{max-width:230px;max-height:280px;border-radius:10px;display:block;margin-bottom:5px;cursor:pointer}
  .tr{margin-top:6px;padding-top:6px;border-top:1px dashed #b9c9e6;font-size:12.5px;color:var(--tr);display:flex;gap:5px}
  .tr .tag{font-size:9.5px;font-weight:800;color:#fff;background:var(--tr);border-radius:4px;padding:1px 5px;height:15px;line-height:13px;flex-shrink:0;margin-top:1px}
  .time{font-size:10px;color:var(--muted);text-align:right;margin-top:3px}
  .empty{margin:auto;color:var(--muted);text-align:center}

  .compose{background:#fff;border-top:1px solid var(--line);padding:12px 16px}
  .compose.disabled{opacity:.5;pointer-events:none}
  .prev{font-size:12.5px;color:var(--tr);background:var(--pk-soft);border:1px solid #d6e2ff;border-radius:9px;padding:8px 11px;margin-bottom:9px;min-height:34px}
  .prev .tag{font-size:9.5px;font-weight:800;color:#fff;background:var(--tr);border-radius:4px;padding:1px 5px;margin-right:6px}
  .crow{display:flex;gap:10px;align-items:flex-end}
  .imgbtn{background:#eef3ff;color:var(--pk);border:1px solid #d6e2ff;width:46px;height:46px;border-radius:12px;font-size:20px;cursor:pointer;flex-shrink:0}
  .imgbtn:hover{background:#dfeaff}
  .crow textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;resize:none;height:46px}
  .crow .send{background:var(--pk);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:19px;cursor:pointer}
  .crow .send:hover{background:#2559d8}

  /* Column 3: customer info */
  .info-col{width:300px;background:#fff;border-left:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
  .info-col .empty2{margin:auto;color:var(--muted);font-size:13px;text-align:center;padding:20px}
  .info-top{padding:22px 18px 16px;text-align:center;border-bottom:1px solid var(--line)}
  .info-top .bigav{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#2f6bed,#57a0ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;margin:0 auto 10px}
  .info-top .iname{font-weight:700;font-size:16px}
  .info-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .info-sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
  .info-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
  .info-row .k{color:var(--muted)}
  .info-row .v{font-weight:600;text-align:right}
  .info-sec select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .info-tags{display:flex;flex-wrap:wrap;gap:5px}
  .info-tags .conv-dot{font-size:10.5px;padding:2px 8px}

  /* Modals */
  .modal{position:fixed;inset:0;background:rgba(20,30,60,.45);display:flex;align-items:center;justify-content:center;z-index:20}
  .modal .inner{background:#fff;border-radius:14px;width:min(740px,94vw);max-height:88vh;overflow:auto;padding:22px}
  .modal h2{font-size:18px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #eef1f6;padding:8px;text-align:left}
  .chk{display:inline-flex;gap:4px;align-items:center;margin-right:8px;font-size:12px}
  .newuser{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .newuser input,.newuser select{padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .btn{background:var(--pk);color:#fff;border:none;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:13px}
  .btn.g{background:#eef1f6;color:#333}
  .x{float:right;cursor:pointer;font-size:20px;color:#999}

  /* Bộ sưu tập ảnh */
  .lib-up{display:inline-flex;align-items:center;gap:8px;background:var(--pk);color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
  .lib-up:hover{background:#2559d8}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px;max-height:54vh;overflow:auto}
  .libcell{border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;background:#f7f9fc}
  .libcell img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer}
  .libcell .cap{font-size:11px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .libcell .del{position:absolute;top:5px;right:5px;background:rgba(224,54,79,.94);color:#fff;border:none;border-radius:6px;width:23px;height:23px;cursor:pointer;font-size:14px;line-height:1}
  .libcell .snd{position:absolute;bottom:28px;right:5px;background:var(--pk);color:#fff;border:none;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:600}

  @media(max-width:1050px){.info-col{display:none}}
  @media(max-width:760px){.list-col{width:100%}.chat-col,.info-col{display:none}}
  .view{flex:1;overflow-y:auto;padding:20px 28px;background:#eef1f6;display:none}
  .view.show{display:block}
  .body.hidden2{display:none}
  .vtitle{font-size:19px;font-weight:800;color:var(--pk-dark);margin-bottom:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .scard .num{font-size:25px;font-weight:800;color:var(--pk-dark)}
  .scard .lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .panel h3{font-size:14px;margin-bottom:12px;color:var(--pk-dark)}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
  .bar .bn{width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .bt{flex:1;background:#eef3ff;border-radius:6px;height:16px;overflow:hidden}
  .bar .bf{height:100%;background:var(--pk);border-radius:6px}
  .bar .bv{width:44px;text-align:right;font-weight:600;flex-shrink:0}
  .crmsearch{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;margin-bottom:12px}
  .crmtable{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .crmtable th{background:var(--pk-soft);color:var(--pk-dark);text-align:left;padding:9px 10px;font-size:12px}
  .crmtable td{border-top:1px solid #eef1f6;padding:8px 10px;vertical-align:middle}
  .crmtable tr.crow{cursor:pointer}.crmtable tr.crow:hover{background:#f7f9fc}
  .st-badge{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:2px 8px;white-space:nowrap}
  .crmpanel{position:fixed;top:0;right:0;width:min(400px,92vw);height:100%;background:#fff;box-shadow:-8px 0 40px rgba(0,0,0,.18);z-index:30;padding:22px;overflow-y:auto}
  .crmpanel h3{font-size:16px;margin-bottom:4px}
  .crmpanel label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  .crmpanel input,.crmpanel select,.crmpanel textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .crmpanel textarea{height:90px;resize:vertical}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.fbtn{border:1px solid #d0d7e2;background:#fff;color:#334;border-radius:7px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:500}
.fbtn:hover{background:#f0f4fb;border-color:#2f6bed}
.fbtn.on{background:#2f6bed;border-color:#2f6bed;color:#fff}
.fbtn.go{background:#12b76a;border-color:#12b76a;color:#fff;margin-left:2px}
.fbtn.go:hover{background:#0ea25c}
.fdate{display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.fdate input[type=date]{border:1px solid #d0d7e2;border-radius:7px;padding:5px 8px;font-size:12.5px;color:#334}
.farrow{color:#889}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="card" id="loginForm">
    <h1>AGO Inbox</h1>
    <div class="sub">Đăng nhập để vào hộp thư team</div>
    <div class="err" id="loginErr"></div>
    <input id="u" placeholder="Tài khoản" autocomplete="username" />
    <input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
    <button type="submit">Đăng nhập</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <span class="brand">💬 AGO Inbox</span>
    <div class="tabs"><span class="tab active">Hội thoại</span><span class="tab">CRM</span><span class="tab">Thống kê</span></div>
    <div class="cfg">
      <span class="chip">📥 Khách→Việt</span><span class="chip">📤 Việt→Khách</span>
      <span class="who" id="who"></span>
      <button class="tbtn" id="waBtn"><span id="waDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0364f;margin-right:5px;vertical-align:middle"></span>Kết nối WhatsApp</button>
      <button class="tbtn hidden" id="usersBtn">👥 Phân quyền</button>
      <button class="tbtn" id="logout">Đăng xuất</button>
    </div>
  </div>

  <div class="body">
    <!-- Conversation list -->
    <div class="list-col">
      <div class="lc-head">
        <div class="lc-title">Hội thoại <small id="convCount"></small></div>
        <select class="lineFilter" id="lineFilter"><option value="">📞 Tất cả line</option></select>
      </div>
      <div class="list" id="convList"></div>
    </div>

    <!-- Chat -->
    <div class="chat-col">
      <div class="chat-head" id="chatHead"><span class="nm">Chọn một hội thoại</span></div>
      <div class="tagbar hidden" id="tagbar"></div>
      <div class="msgs" id="msgs"><div class="empty">👋 Chọn hội thoại bên trái để bắt đầu</div></div>
      <div class="compose disabled" id="compose">
        <div class="prev" id="prev"><span class="tag">EN</span>Bản dịch tiếng Anh khách sẽ nhận…</div>
        <div class="crow">
          <button class="imgbtn" id="imgBtn" title="Bộ sưu tập ảnh">🖼️</button>
          <textarea id="input" placeholder="Gõ tiếng Việt… (sẽ dịch sang Anh trước khi gửi)"></textarea>
          <button class="send" id="send">➤</button>
        </div>
      </div>
    </div>

    <!-- Customer info -->
    <div class="info-col" id="infoCol">
      <div class="empty2">Thông tin khách hàng<br>sẽ hiện ở đây</div>
    </div>
  </div>
  <div class="view" id="statsView"></div>
  <div class="view" id="crmView"></div>
</div>

<script>
const api = (p,opt={})=>fetch(p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt}).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()});
let me=null, current=null, convs=[], agents=[], tags=[], custLangs=[], typingTimer=null, currentConv=null;
const tagMap=()=>Object.fromEntries(tags.map(t=>[t.id,t]));
const langTag=()=>((currentConv&&currentConv.custLang)?currentConv.custLang:'en').toUpperCase();

document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const err=document.getElementById('loginErr'); err.textContent='';
  try{ await api('/api/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})}); await boot(); }
  catch(ex){ err.textContent='Sai tài khoản hoặc mật khẩu'; }
});
document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};

async function boot(){
  try{ me=await api('/api/me'); }catch{ show('login'); return; }
  show('app');
  document.getElementById('who').textContent=`${me.name} · ${me.role}`;
  if(me.permissions.includes('manage_users')) document.getElementById('usersBtn').classList.remove('hidden');
  if(me.permissions.includes('assign')) agents=await api('/api/agents').catch(()=>[]);
  tags=await api('/api/tags').catch(()=>[]);
  custLangs=await api('/api/cust-langs').catch(()=>[{code:'en',label:'English'},{code:'fr',label:'Français'}]);
  await loadNumbers(); await loadConvs(); startStream(); refreshWaDot();
}
function show(which){
  document.getElementById('login').classList.toggle('hidden', which!=='login');
  document.getElementById('app').classList.toggle('hidden', which!=='app');
}

async function loadNumbers(){
  try{
    const nums=await api('/api/numbers');
    const sel=document.getElementById('lineFilter');
    sel.innerHTML='<option value="">📞 Tất cả line</option>'+nums.map(n=>`<option value="${esc(n.id)}">${esc(n.label)}</option>`).join('');
    sel.onchange=()=>loadConvs();
  }catch{}
}

function previewText(last){
  if(!last) return '';
  const body = last.trans||last.orig||(last.img?'📷 Hình ảnh':'');
  return (last.dir==='in'?'':'Bạn: ')+body;
}

async function loadConvs(){
  const ch=document.getElementById('lineFilter')?.value||'';
  convs=await api('/api/conversations'+(ch?('?channel='+encodeURIComponent(ch)):''));
  document.getElementById('convCount').textContent=`(${convs.length})`;
  const tm=tagMap();
  const el=document.getElementById('convList'); el.innerHTML='';
  if(!convs.length){ el.innerHTML='<div class="empty" style="padding:24px">Chưa có hội thoại nào.<br><small>Tin khách nhắn tới sẽ hiện ở đây.</small></div>'; return; }
  for(const c of convs){
    const last=previewText(c.last);
    const dots=(c.tags||[]).map(id=>tm[id]).filter(Boolean).map(t=>`<span class="conv-dot" style="background:${t.color}">${esc(t.label)}</span>`).join('');
    const d=document.createElement('div'); d.className='conv'+(current===c.id?' active':'');
    d.innerHTML=`<div class="av">${(c.name||'?')[0].toUpperCase()}</div>
      <div class="b"><div class="n"><span class="nm">${esc(c.name)}</span><span style="display:flex;gap:5px;align-items:center">${c.channelLabel?`<span class="line-tag">${esc(c.channelLabel)}</span>`:''}${c.unread?`<span class="badge">${c.unread}</span>`:''}</span></div>
      <div class="m">${c.assignedTo?`<span class="assign-tag">${esc(c.assignedTo)}</span> `:''}${esc(last).slice(0,46)}</div>
      ${dots?`<div class="conv-tags">${dots}</div>`:''}</div>`;
    d.onclick=()=>openConv(c.id);
    el.appendChild(d);
  }
}

async function openConv(id){
  current=id;
  const c=await api('/api/conversations/'+id); currentConv=c;

function renderTagbar(conv){
  const bar=document.getElementById('tagbar'); if(!bar) return;
  const active=new Set(conv.tags||[]);
  const canTag=me.permissions.includes('reply');
  bar.innerHTML = tags.map(t=>{
    const on=active.has(t.id);
    const style=on?`background:${t.color};color:#fff;border-color:${t.color}`:`color:${t.color};border-color:${t.color}`;
    return `<span class="tagchip ${on?'':'off'}" data-tag="${t.id}" style="${style}">${esc(t.label)}</span>`;
  }).join('') + (me.permissions.includes('assign')?`<span class="tag-add" id="tagAdd">＋ Thẻ mới</span>`:'');
  bar.classList.remove('hidden');
  if(canTag) bar.querySelectorAll('[data-tag]').forEach(el=>el.onclick=async()=>{
    const id=el.dataset.tag; const cur=new Set(currentConv.tags||[]);
    cur.has(id)?cur.delete(id):cur.add(id);
    const arr=[...cur];
    try{ await api('/api/conversations/'+currentConv.id+'/tags',{method:'POST',body:JSON.stringify({tags:arr})});
      currentConv.tags=arr; renderTagbar(currentConv); renderInfo(currentConv); loadConvs();
    }catch(ex){ alert(ex.message); }
  });
  const add=document.getElementById('tagAdd');
  if(add) add.onclick=async()=>{
    const label=prompt('Tên thẻ mới (vd: VIP, Cần gọi lại, Đơn mới):'); if(!label||!label.trim())return;
    const color=prompt('Màu thẻ — nhập mã hex (vd #e0364f đỏ, #22a06b xanh):','#2f6bed'); if(color===null)return;
    try{ const t=await api('/api/tags',{method:'POST',body:JSON.stringify({label,color:color||'#2f6bed'})}); tags.push(t); renderTagbar(currentConv); }
    catch(ex){ alert(ex.message); }
  };
}

function startStream(){
  const es=new EventSource('/api/stream');
  es.onmessage=e=>{ const ev=JSON.parse(e.data);
    if(ev.type==='wa-status'){ setWaDot(ev.status); if(document.getElementById('wamodal')) renderWA(); return; }
    if(ev.type==='tagged'){ if(currentConv&&ev.conversation.id===current){ currentConv.tags=ev.conversation.tags; renderTagbar(currentConv); renderInfo(currentConv); } loadConvs(); return; }
    if(ev.type==='lang'){ if(currentConv&&ev.conversation.id===current){ currentConv.custLang=ev.conversation.custLang; const ls=document.getElementById('langSel'); if(ls) ls.value=currentConv.custLang; updatePreviewFromInput(); } return; }
    if(ev.type==='status'){ if(currentConv&&ev.convId===current){ for(const m of (currentConv.messages||[])){ if(m.waId===ev.waId&&(m.status||0)<ev.status) m.status=ev.status; } renderMsgs(currentConv.messages); } return; }
    if(ev.type==='message'&&ev.conversation.id===current) openConv(current);
    loadConvs();
  };
  es.onerror=()=>{ es.close(); setTimeout(startStream,3000); };
}

function bar(label,count,max){ const pct=max?Math.round(count/max*100):0; return `<div class="bar"><span class="bn" title="${esc(label)}">${esc(label)}</span><span class="bt"><span class="bf" style="width:${pct}%"></span></span><span class="bv">${count}</span></div>`; }
function tick(m){ const s=m.status||0; if(s>=3) return ' <span style="color:#53bdeb" title="Đã xem">✓✓</span>'; if(s===2) return ' <span style="color:#8a94a6" title="Đã nhận">✓✓</span>'; if(s===1) return ' <span style="color:#8a94a6" title="Đã gửi">✓</span>'; return ' <span style="color:#8a94a6" title="Đang gửi">🕐</span>'; }
function svgDonut(items,total){
  if(!total) return '<div style="color:#888;font-size:13px">Chưa có dữ liệu</div>';
  let acc=0; const R=52,C=2*Math.PI*R; let segs='';
  for(const it of items){ if(!it.count) continue; const len=it.count/total*C; segs+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${it.color}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)"></circle>`; acc+=len; }
  const legend=items.map(it=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:5px"><span style="width:11px;height:11px;border-radius:3px;background:${it.color};display:inline-block"></span>${esc(it.label)}<b style="margin-left:auto">${it.count}</b></div>`).join('');
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">${segs}<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="800" fill="#1e2a4a">${total}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#8a94a6">khách</text></svg><div style="flex:1;min-width:150px">${legend}</div></div>`;
}
function svgBars(items){
  const W=300,H=150; const max=Math.max(1,...items.map(x=>x.v)); const n=items.length||1; const bw=(W-16)/n;
  let g=''; items.forEach((x,i)=>{ const h=Math.round(x.v/max*(H-40)); const xx=8+i*bw+bw*0.15; const w=bw*0.7; const y=H-20-h; g+=`<rect x="${xx.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${h}" rx="4" fill="#2f6bed"></rect><text x="${(xx+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#8a94a6">${esc(x.l)}</text><text x="${(xx+w/2).toFixed(1)}" y="${(y-4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e2a4a">${x.v}</text>`; });
  return `<svg width="100%" height="150" viewBox="0 0 300 150">${g}</svg>`;
}
let statFrom=0, statTo=0, statPreset='all';
function isoLocal(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayStart(d){ d.setHours(0,0,0,0); return d.getTime(); }
function dayEnd(d){ d.setHours(23,59,59,999); return d.getTime(); }
function presetRange(p){
  const now=new Date(); let from=0,to=0; const dow=(now.getDay()+6)%7;
  if(p==='today'){ from=dayStart(new Date(now)); to=dayEnd(new Date(now)); }
  else if(p==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); from=dayStart(new Date(y)); to=dayEnd(new Date(y)); }
  else if(p==='thisweek'){ const s=new Date(now); s.setDate(s.getDate()-dow); from=dayStart(s); to=dayEnd(new Date(now)); }
  else if(p==='lastweek'){ const s=new Date(now); s.setDate(s.getDate()-dow-7); const e=new Date(s); e.setDate(e.getDate()+6); from=dayStart(s); to=dayEnd(e); }
  else if(p==='7days'){ const s=new Date(now); s.setDate(s.getDate()-6); from=dayStart(s); to=dayEnd(new Date(now)); }
  else if(p==='thismonth'){ const s=new Date(now.getFullYear(),now.getMonth(),1); from=dayStart(s); to=dayEnd(new Date(now)); }
  else if(p==='lastmonth'){ const s=new Date(now.getFullYear(),now.getMonth()-1,1); const e=new Date(now.getFullYear(),now.getMonth(),0); from=dayStart(s); to=dayEnd(e); }
  else if(p==='30days'){ const s=new Date(now); s.setDate(s.getDate()-29); from=dayStart(s); to=dayEnd(new Date(now)); }
  else if(p==='60days'){ const s=new Date(now); s.setDate(s.getDate()-59); from=dayStart(s); to=dayEnd(new Date(now)); }
  return {from,to};
}
function setStatPreset(p){ statPreset=p; if(p==='all'){ statFrom=0; statTo=0; } else { const r=presetRange(p); statFrom=r.from; statTo=r.to; } loadStats(); }
function applyStatCustom(){
  const f=document.getElementById('statFromInput'), t=document.getElementById('statToInput');
  if(f&&f.value){ statFrom=dayStart(new Date(f.value+'T00:00:00')); }
  if(t&&t.value){ statTo=dayEnd(new Date(t.value+'T00:00:00')); }
  statPreset='custom'; loadStats();
}
function filterBar(){
  const presets=[['today','Hôm nay'],['yesterday','Hôm qua'],['thisweek','Tuần này'],['lastweek','Tuần trước'],['7days','7 ngày'],['thismonth','Tháng này'],['lastmonth','Tháng trước'],['30days','30 ngày'],['60days','60 ngày'],['all','Tất cả']];
  const btns=presets.map(p=>'<button class="fbtn'+(statPreset===p[0]?' on':'')+'" onclick="setStatPreset(\''+p[0]+'\')">'+p[1]+'</button>').join('');
  const fv=statFrom?isoLocal(statFrom):'';
  const tv=statTo?isoLocal(statTo):'';
  return '<div class="fbar">'+btns+'<span class="fdate"><input type="date" id="statFromInput" value="'+fv+'"><span class="farrow">→</span><input type="date" id="statToInput" value="'+tv+'"><button class="fbtn go" onclick="applyStatCustom()">Lọc</button></span></div>';
}
function svgDayBars(days){
  if(!days||!days.length) return '<div style="color:#888;font-size:13px">—</div>';
  const max=Math.max(1,...days.map(d=>d.count));
  const n=days.length, W=Math.max(320,n*26), H=150, pad=6, gap=6;
  const step=(W-pad*2)/n, bw=Math.max(5,step-gap);
  let bars='';
  days.forEach((d,i)=>{
    const x=pad+i*step;
    const h=Math.round((H-38)*d.count/max);
    const y=H-22-h;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1)+'" rx="2" fill="#2f6bed"><title>'+d.label+': '+d.count+'</title></rect>';
    if(d.count>0) bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-3)+'" font-size="9" text-anchor="middle" fill="#555">'+d.count+'</text>';
    if(n<=32||i%3===0) bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" font-size="8" text-anchor="middle" fill="#999">'+d.label+'</text>';
  });
  return '<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" style="max-width:100%;display:block">'+bars+'</svg></div>';
}
function chartsBlock(s){
  const totalSt=s.byStatus.reduce((a,b)=>a+b.count,0);
  const timeBars=svgBars([{l:'Hôm nay',v:s.time.today},{l:'7 ngày',v:s.time.d7},{l:'30 ngày',v:s.time.d30}]);
  const saleBars=s.bySale.length?svgBars(s.bySale.slice(0,6).map(x=>({l:(x.name||'').split(' ')[0],v:x.convs}))):'<div style="color:#888;font-size:13px">—</div>';
  return `<div class="panel"><h3>📅 Tin nhắn theo ngày</h3>${svgDayBars(s.byDay||[])}</div>
    <div class="panel"><h3>🥧 Tỉ lệ trạng thái khách</h3>${svgDonut(s.byStatus,totalSt)}</div>
    <div class="cards" style="grid-template-columns:1fr 1fr">
      <div class="panel" style="margin-bottom:0"><h3>📊 Tin theo thời gian</h3>${timeBars}</div>
      <div class="panel" style="margin-bottom:0"><h3>📊 Khách theo sale</h3>${saleBars}</div>
    </div>`;
}
async function loadStats(){
  const el=document.getElementById('statsView');
  el.innerHTML='<div class="vtitle">📊 Thống kê</div><div style="color:#888">Đang tải…</div>';
  let s; try{ s=await api('/api/stats?from='+statFrom+'&to='+statTo); }catch(ex){ el.innerHTML='<div class="vtitle">📊 Thống kê</div><p style="color:#e0364f">Lỗi: '+esc(ex.message)+'</p>'; return; }
  const money=(n)=>n?Number(n).toLocaleString('vi-VN'):'0';
  const maxLine=Math.max(1,...s.byLine.map(x=>x.count));
  const maxTag=Math.max(1,...s.byTag.map(x=>x.count));
  el.innerHTML=`<div class="vtitle">📊 Thống kê</div>
    ${filterBar()}
    <div class="cards">
      <div class="scard"><div class="num">${s.totals.convs}</div><div class="lbl">Khách hội thoại</div></div>
      <div class="scard"><div class="num">${s.totals.msgs}</div><div class="lbl">Tổng tin nhắn</div></div>
      <div class="scard"><div class="num">${s.totals.won}</div><div class="lbl">Đã chốt</div></div>
      <div class="scard"><div class="num">${s.totals.rate}%</div><div class="lbl">Tỉ lệ chốt</div></div>
      <div class="scard"><div class="num">${money(s.totals.revenue)}</div><div class="lbl">Doanh thu chốt (VND)</div></div>
    </div>
    ${chartsBlock(s)}<div class="panel"><h3>🕒 Tin nhắn theo thời gian</h3>
      <div class="cards" style="margin-bottom:0">
        <div class="scard"><div class="num">${s.time.today}</div><div class="lbl">Hôm nay</div></div>
        <div class="scard"><div class="num">${s.time.d7}</div><div class="lbl">7 ngày</div></div>
        <div class="scard"><div class="num">${s.time.d30}</div><div class="lbl">30 ngày</div></div>
      </div></div>
    <div class="panel"><h3>👤 Theo sale</h3>${s.bySale.length?('<table class="crmtable"><tr><th>Sale</th><th>Khách</th><th>Tin</th><th>Chốt</th></tr>'+s.bySale.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.convs}</td><td>${x.msgs}</td><td>${x.won}</td></tr>`).join('')+'</table>'):'<div style="color:#888;font-size:13px">Chưa có dữ liệu</div>'}</div>
    <div class="panel"><h3>📞 Theo line</h3>${s.byLine.map(x=>bar(x.label,x.count,maxLine)).join('')||'<div style="color:#888;font-size:13px">—</div>'}</div>
    <div class="panel"><h3>🏷️ Theo thẻ</h3>${s.byTag.length?s.byTag.map(x=>bar(x.label,x.count,maxTag)).join(''):'<div style="color:#888;font-size:13px">Chưa gắn thẻ nào</div>'}</div>`;
}
async function loadCRM(){
  const el=document.getElementById('crmView');
  el.innerHTML='<div class="vtitle">📇 CRM khách hàng</div><div style="color:#888">Đang tải…</div>';
  try{ if(!crmStatus.length){ const m=await api('/api/crm-meta'); crmStatus=m.status; } crmData=await api('/api/crm'); }
  catch(ex){ el.innerHTML='<div class="vtitle">📇 CRM khách hàng</div><p style="color:#e0364f">Lỗi: '+esc(ex.message)+'</p>'; return; }
  el.innerHTML=`<div class="vtitle">📇 CRM khách hàng <small style="color:#888;font-weight:500">(${crmData.length})</small></div>
    <input class="crmsearch" id="crmSearch" placeholder="🔍 Tìm tên, số, email, sản phẩm…">
    <div id="crmTableWrap"></div>`;
  document.getElementById('crmSearch').oninput=renderCRMTable;
  renderCRMTable();
}
function stLabel(code){ return crmStatus.find(x=>x.code===code)||{label:code,color:'#8a94a6'}; }
function renderCRMTable(){
  const q=(document.getElementById('crmSearch')?.value||'').toLowerCase();
  const rows=crmData.filter(c=>!q||[c.name,c.customer,c.email,c.product].some(v=>(v||'').toLowerCase().includes(q)));
  const wrap=document.getElementById('crmTableWrap');
  if(!rows.length){ wrap.innerHTML='<div style="color:#888;font-size:13px;padding:16px">Không có khách phù hợp.</div>'; return; }
  wrap.innerHTML='<table class="crmtable"><tr><th>Khách</th><th>Trạng thái</th><th>Sale</th><th>Sản phẩm</th><th>Giá trị</th><th>Tin</th></tr>'+
    rows.map(c=>{ const st=stLabel(c.status); return `<tr class="crow" data-id="${esc(c.id)}"><td><b>${esc(c.name)}</b><br><small style="color:#888">${esc(c.customer)}</small></td><td><span class="st-badge" style="background:${st.color}">${esc(st.label)}</span></td><td>${esc(c.assignedTo||'—')}</td><td>${esc(c.product||'—')}</td><td>${c.dealValue?Number(c.dealValue).toLocaleString('vi-VN'):'—'}</td><td>${c.msgCount}</td></tr>`; }).join('')+'</table>';
  wrap.querySelectorAll('.crow').forEach(r=>r.onclick=()=>openCRM(r.dataset.id));
}
function openCRM(id){
  const c=crmData.find(x=>x.id===id); if(!c) return;
  const ex=document.getElementById('crmpanel'); if(ex) ex.remove();
  const opts=crmStatus.map(s=>`<option value="${s.code}" ${c.status===s.code?'selected':''}>${esc(s.label)}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="crmpanel" id="crmpanel">
    <span id="crmclose" style="float:right;cursor:pointer;font-size:22px;color:#999">×</span>
    <h3>${esc(c.name)}</h3><div style="font-size:12px;color:#888">${esc(c.customer)} · ${esc(c.channelLabel||'')}</div>
    <label>Trạng thái</label><select id="cp_status">${opts}</select>
    <label>Email</label><input id="cp_email" value="${esc(c.email||'')}">
    <label>Sản phẩm quan tâm</label><input id="cp_product" value="${esc(c.product||'')}">
    <label>Giá trị đơn (VND)</label><input id="cp_deal" type="number" value="${c.dealValue||0}">
    <label>Ghi chú</label><textarea id="cp_note">${esc(c.note||'')}</textarea>
    <button class="btn" id="cp_save" style="margin-top:14px;width:100%">💾 Lưu</button></div>`);
  document.getElementById('crmclose').onclick=()=>document.getElementById('crmpanel').remove();
  document.getElementById('cp_save').onclick=async()=>{
    const body={status:document.getElementById('cp_status').value,email:document.getElementById('cp_email').value,product:document.getElementById('cp_product').value,dealValue:document.getElementById('cp_deal').value,note:document.getElementById('cp_note').value};
    try{ const r=await api('/api/conversations/'+c.id+'/crm',{method:'POST',body:JSON.stringify(body)}); Object.assign(c,r.conversation); document.getElementById('crmpanel').remove(); renderCRMTable(); }
    catch(ex){ alert(ex.message); }
  };
}
initTabs();
boot();
</script>
</body>
</html>
